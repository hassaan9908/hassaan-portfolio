<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Muhammad Hassaan — Flutter &amp; MERN Stack Developer</title>
    <meta
      name="description"
      content="Muhammad Hassaan is a Flutter and MERN stack developer in Islamabad, building cross-platform mobile apps published on the Apple App Store and full-stack web products."
    />
    <meta name="author" content="Muhammad Hassaan" />
    <meta name="theme-color" content="#fbfaf8" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Muhammad Hassaan — Flutter & MERN Stack Developer" />
    <meta
      property="og:description"
      content="Cross-platform mobile apps and full-stack web products. Flutter, Dart, React, Node.js."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the stored theme before first paint so there's no flash of light.
      (function () {
        try {
          var t = localStorage.getItem('portfolio-theme');
          if (t) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
